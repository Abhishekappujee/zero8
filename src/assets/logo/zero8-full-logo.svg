<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" fill="none" role="img" aria-label="ZERO8 — Great Food For Best People">
  <defs>
    <linearGradient id="champagneGoldFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECD7A4"/>
      <stop offset="50%" stop-color="#C9A15A"/>
      <stop offset="100%" stop-color="#9E7836"/>
    </linearGradient>
    <filter id="subtleGlowFull" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Centered Intertwined 08 Monogram -->
  <g transform="translate(80, 10) scale(1)" filter="url(#subtleGlowFull)" stroke="url(#champagneGoldFull)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- '0' Loop -->
    <path d="M 52,15 
             C 28,15 15,30 15,50 
             C 15,70 28,85 52,85 
             C 76,85 89,70 89,50 
             C 89,30 76,15 52,15 Z" />

    <!-- '8' Top Loop -->
    <path d="M 108,50 
             C 92,50 82,38 82,27 
             C 82,16 94,15 108,15 
             C 122,15 134,16 134,27 
             C 134,38 124,50 108,50 Z" />

    <!-- '8' Bottom Loop -->
    <path d="M 108,50 
             C 88,50 78,62 78,73 
             C 78,84 92,85 108,85 
             C 124,85 138,84 138,73 
             C 138,62 128,50 108,50 Z" />

    <!-- Intertwining weave accent -->
    <path d="M 72,32 C 80,38 86,45 88,50 C 86,55 80,62 72,68" stroke="url(#champagneGoldFull)" stroke-width="6.5" />
  </g>

  <!-- Spaced Uppercase ZERO8 Wordmark -->
  <text x="160" y="132" 
        text-anchor="middle" 
        fill="#E9D7BB" 
        font-family="'Playfair Display', 'Cinzel', 'Times New Roman', serif" 
        font-size="25" 
        font-weight="600" 
        letter-spacing="9" 
        style="text-transform: uppercase;">
    ZERO8
  </text>

  <!-- Tagline: Great Food For Best People -->
  <text x="160" y="156" 
        text-anchor="middle" 
        fill="#C9A15A" 
        font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
        font-size="8.5" 
        font-weight="500" 
        letter-spacing="4" 
        style="text-transform: uppercase; opacity: 0.92;">
    GREAT FOOD FOR BEST PEOPLE
  </text>

  <!-- Subtle Accent Line -->
  <line x1="120" y1="168" x2="200" y2="168" stroke="url(#champagneGoldFull)" stroke-width="0.75" stroke-opacity="0.6" />
</svg>
