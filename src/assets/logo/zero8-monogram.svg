<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 100" fill="none" role="img" aria-label="ZERO8 Monogram">
  <defs>
    <linearGradient id="champagneGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C88E"/>
      <stop offset="50%" stop-color="#C9A15A"/>
      <stop offset="100%" stop-color="#9E7836"/>
    </linearGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Intertwined 08 Monogram -->
  <g filter="url(#subtleGlow)" stroke="url(#champagneGold)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- '0' Monogram Loop (Left) -->
    <path d="M 52,15 
             C 28,15 15,30 15,50 
             C 15,70 28,85 52,85 
             C 76,85 89,70 89,50 
             C 89,30 76,15 52,15 Z" />

    <!-- '8' Top Loop (Right) -->
    <path d="M 108,50 
             C 92,50 82,38 82,27 
             C 82,16 94,15 108,15 
             C 122,15 134,16 134,27 
             C 134,38 124,50 108,50 Z" />

    <!-- '8' Bottom Loop (Right) -->
    <path d="M 108,50 
             C 88,50 78,62 78,73 
             C 78,84 92,85 108,85 
             C 124,85 138,84 138,73 
             C 138,62 128,50 108,50 Z" />

    <!-- Intertwining weave accent: overlapping bridge to interlock the 0 and 8 -->
    <path d="M 72,32 C 80,38 86,45 88,50 C 86,55 80,62 72,68" 
          stroke="url(#champagneGold)" stroke-width="6.5" />
  </g>
</svg>
